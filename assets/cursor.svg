<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 24" width="20" height="24">
  <defs>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }
    </style>
  </defs>
  <rect x="0" y="4" width="12" height="18" class="cursor" />
</svg>

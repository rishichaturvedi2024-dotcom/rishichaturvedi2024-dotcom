<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="800" height="20">
  <defs>
    <style>
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .line {
        fill: #30363d;
      }
      .scanner {
        fill: #58a6ff;
        opacity: 0.5;
        animation: scan 2s linear infinite;
      }
    </style>
  </defs>
  
  <rect x="0" y="9" width="800" height="2" class="line" />
  <rect x="0" y="9" width="200" height="2" class="scanner" />
  
  <circle cx="400" cy="10" r="4" fill="#58a6ff" />
  <circle cx="390" cy="10" r="2" fill="#30363d" />
  <circle cx="410" cy="10" r="2" fill="#30363d" />
</svg>
